# --variant accepts any string silently, so effort can never be verified.
name = "opencode"
binary = "opencode"
base_argv = ["run", "--standalone", "--format", "json"]
# --standalone runs a private in-process server instead of the shared
# background service. Without it, a confined friend that cannot see the host's
# background service tries to start its own on the same fixed port and collides
# with any opencode the operator already has running ("Managed service port N
# is already in use"). --standalone makes each dispatch self-contained.
# Verified against opencode 2.1.4: --standalone emits the same NDJSON event
# types as the shared-service path (step_start, text, etc.).
# Verified against `opencode run --format json` with the prompt piped: it
# reads stdin and emits its usual NDJSON. argv was the E2BIG exposure issue
# #4 documented for claude -- Linux caps a single argument near 128KB, and a
# composed review context passes that easily.
prompt_mode = "stdin"
readonly_argv = []
schema_flag = ""
model_flag = "--model"
models_argv = ["models"]
models_format = "lines"
internal_timeout_flag = ""
effort_kind = "unverified"
structured_output = true
# Authority evidence captured from installed opencode 1.18.18 on 2026-08-30:
# `opencode --help` exposes `--pure` only for external plugins. The same help
# exposes MCP management and agent execution but no invocation-local option
# proving that inherited MCP servers and tools are disabled, so `--pure` alone
# is insufficient and this adapter remains fail-closed.
external_tools = "uncontrolled"
deny_external_tools_argv = []
external_tool_sources = ["tools", "MCP servers", "external plugins"]

[effort]
low = ["--variant", "minimal"]
high = ["--variant", "high"]
max = ["--variant", "max"]

# `opencode run --format json` emits NDJSON (one event object per line).
# Captured from opencode 2.1.4 on 2026-10-27: the model's answer arrives as a
# "text" event whose part.text holds the JSON-escaped findings payload. An
# earlier version of this adapter declared no success rule because no
# success-carrying event had been observed -- only the "error" event was
# captured. A stream with no "error" line and no "text" line makes ndjson
# unwrapping report "found nothing," so normalize() falls back to scanning
# the raw NDJSON text line-by-line.
#
# The error event's shape was captured from a real ProviderAuthError; the
# text event's shape from a real Verda review of the seeded archive-path
# artifact. The answer may span multiple "text" events (streamed deltas);
# the latest producing rule wins, matching the latest-first stream ordering
# normalize already relies on for other ndjson adapters.
[envelope]
kind = "ndjson"
match_field = "type"

[[envelope.rules]]
type = "text"
field = "part.text"

[[envelope.rules]]
type = "error"
field = "error.data.message"

# §12.2: opencode declares no readonly_argv, so it runs under OS-level
# confinement and must be told where its own configuration and credentials
# live -- a sandbox missing a credential path does not fail loudly, it makes
# the CLI look like a broken friend. Paths are the documented XDG locations
# plus opencode's own directories; a path that does not exist on a given
# machine is simply not bound (see sandbox.linux_argv on --ro-bind-try).
[sandbox]
# Its own configuration and binary. opencode also keeps a bun cache in
# `$TMPDIR` and a log under `$XDG_DATA_HOME` (~/.local/share/opencode/log).
# The log path is an absolute path resolved from the real HOME, not from a
# redirected XDG_DATA_HOME, so childenv.private_dirs cannot redirect it:
# opencode 2.1.4 writes /home/.../.local/share/opencode/log/opencode.log
# directly and exits with EROFS if that path is read-only. Granting write
# to the whole share directory is the measured fix; it exposes the operator's
# opencode session/log state to the friend, but a confined friend's HOME
# inside the namespace already differs, and --no-session keeps the run
# ephemeral. The credential files (apiKey via {file:...} in opencode.json)
# live under ~/.config/opencode, which stays read-only.
read = [
  "~/.config/opencode",
  "~/.local/state/opencode",
  "~/.cache/opencode",
  "~/.opencode",
  "~/.npm",
  "~/.bun",
  "~/.config/node",
]
write = [
  "~/.local/share/opencode",
]



# §12.2: opencode runs confined, so it receives an allowlisted environment
# rather than the operator's whole shell. These are the variables it may
# legitimately need -- its own provider credentials, which §12.3 already
# accepts a friend can exfiltrate. Everything else is withheld, including
# every OTHER service's token.
#
# Deliberately not exhaustive: guessing at a long list would re-open the hole
# it exists to close. An operator whose setup needs one more can pass
# --pass-env VAR, and the run records how many were withheld.
[env]
pass = [
  "OPENCODE_CONFIG",
  "OPENCODE_CONFIG_DIR",
  "OPENAI_API_KEY",
  "ANTHROPIC_API_KEY",
  "OPENROUTER_API_KEY",
  "GROQ_API_KEY",
  # An operator whose Verda provider config reads the key from an env var
  # (e.g. $VERDA_API_KEY) instead of {file:...} needs it passed; one using a
  # file-based key (the opencode.json "{file:...}" form) does not.
  "VERDA_API_KEY",
  # `opencode auth list` reports where it actually looks for credentials,
  # and on the machine this was captured from it named exactly these two --
  # no stored credentials at all, both providers read from the environment.
  # Without them a confined opencode reaches its provider and is refused by
  # it, which reads as a server error rather than a missing key.
  "GEMINI_API_KEY",
  # What `opencode auth list` names and what the Google provider actually
  # reads are two different variables. With `GEMINI_API_KEY` alone -- which is
  # the one that listing reports -- a run answers with the ProviderAuthError
  # quoted below, naming `GOOGLE_GENERATIVE_AI_API_KEY`; setting that one
  # instead, opencode answers normally. Withholding the variable this
  # adapter's own remediation tells an operator to set would make following
  # that advice fail silently.
  "GOOGLE_GENERATIVE_AI_API_KEY",
  "HF_TOKEN",
]

# §14's first structured auth marker, captured verbatim from a real failure:
# a confined opencode with no provider credential in its allowlisted
# environment answered with
#
#   {"type":"error","error":{"name":"ProviderAuthError","data":{
#     "providerID":"google","message":"Google Generative AI API key is
#     missing. Pass it using the 'apiKey' parameter or the
#     GOOGLE_GENERATIVE_AI_API_KEY environment variable."}}}
#
# on stdout and exited 1. This is the shape §14 asks for -- the CLI's own
# structured output naming the failure, not a guessed stderr substring.
# `providerID` is deliberately not matched: which provider is missing a key
# is not what makes this an auth failure.
[auth]
markers = [{ path = "error.name", equals = "ProviderAuthError" }]
remediation = "set the provider credential opencode names in its error (e.g. GOOGLE_GENERATIVE_AI_API_KEY) and pass it with --pass-env, or run `opencode auth login`"
