name = "codex"
binary = "codex"
base_argv = ["exec", "--json"]
prompt_mode = "stdin"
# Codex's own macOS command sandbox cannot nest inside afriend's Seatbelt
# profile: a local shell read then fails with `sandbox_apply: Operation not
# permitted`. The outer profile therefore supplies the read-only checkout;
# Codex runs its command tool without an inner sandbox, but is refused when
# the outer mechanism is unavailable.
readonly = true
self_confines = false
readonly_argv = ["--sandbox", "danger-full-access"]
schema_flag = "--output-schema"
model_flag = "--model"
internal_timeout_flag = ""
effort_kind = "native"
# Authority evidence captured from installed codex-cli 0.150.1 on 2026-08-30:
# `codex exec --help` documents `--ignore-user-config` and repeatable
# `--disable <FEATURE>`; the exact option-position invocation
# `codex exec --ignore-user-config --disable apps --disable plugins --disable
# browser_use --disable browser_use_external --disable computer_use --disable
# in_app_browser --disable standalone_web_search --help` parses successfully.
# These options are emitted before any prompt. The browser/computer/search
# features are built-in remote tools, not plugin-provided integrations: a
# confined probe that disabled only apps/plugins used web search and reported
# the public release's VERSION instead of the checkout's. They must be denied
# under the same external-tool contract.
external_tools = "deny-argv"
deny_external_tools_argv = [
  "--ignore-user-config",
  "--disable", "apps",
  "--disable", "plugins",
  "--disable", "browser_use",
  "--disable", "browser_use_external",
  "--disable", "computer_use",
  "--disable", "in_app_browser",
  "--disable", "standalone_web_search",
]
deny_external_tools_probe_argv = [
  "exec",
  "--ignore-user-config",
  "--disable", "apps",
  "--disable", "plugins",
  "--disable", "browser_use",
  "--disable", "browser_use_external",
  "--disable", "computer_use",
  "--disable", "in_app_browser",
  "--disable", "standalone_web_search",
  "--help",
]
deny_external_tools_probe_markers = ["--ignore-user-config", "--disable"]
external_tool_sources = [
  "user config",
  "apps",
  "plugins",
  "MCP servers",
  "built-in browser, computer, and web search tools",
]
# --json emits an NDJSON event stream, not a single object. Captured from
# codex 0.149.0 on 2026-08-23: thread.started, turn.started, item.completed,
# turn.completed -- with the model's answer in the item.completed event whose
# item.type is "agent_message", at item.text as a JSON-escaped string. Note
# codex also writes a non-JSON line ("Reading additional input from stdin...")
# to stdout, so the NDJSON reader must skip unparseable lines rather than fail.
#
# Under --output-schema codex ALSO emits its progress narration as
# agent_message items, each forced into the schema's shape -- "I'm inspecting
# the repository..." arrived as a valid findings object with location null,
# before the real answer. The ndjson unwrapper therefore offers matches
# latest-first (captured: tests/fixtures/codex_progress_then_findings.ndjson).
structured_output = true

# codex refuses to start outside a git repository:
#
#   Not inside a trusted directory and --skip-git-repo-check was not specified.
#
# Doc scope is a bare directory holding a copy of the artifact, and EVERY
# friend is downgraded to doc scope whenever the artifact is not inside a
# repository -- so without this codex fails every such run before the model
# sees anything. Found by running this tool against an artifact outside a
# repo.
#
# The flag skips codex's own trust check and nothing else. Verified against
# the real CLI: with it, codex starts in a bare directory, reads the
# artifact, and STILL cannot write outside its workspace -- "the filesystem
# sandbox is read-only and the target is outside the permitted workspace".
doc_argv = ["--skip-git-repo-check"]

[envelope]
kind = "ndjson"
match_field = "type"

# Where codex says why it failed, rather than what it answered. Captured
# from a real quota exhaustion: `{"type":"error","message":"You've hit your
# usage limit. ... try again at Sep 14th, 2026 6:51 PM."}` on stdout, while
# stderr held only the "Reading prompt from stdin..." banner.
[[envelope.error_rules]]
type = "error"
field = "message"

[[envelope.rules]]
type = "item.completed"
# Both halves of what the note above describes. Matching on `type` alone
# also caught reasoning, command-execution and file-change items, any of
# which may carry their own `item.text`.
where = "item.type"
equals = "agent_message"
field = "item.text"

[effort]
low = ["--config", "model_reasoning_effort=low"]
medium = ["--config", "model_reasoning_effort=medium"]
high = ["--config", "model_reasoning_effort=high"]
xhigh = ["--config", "model_reasoning_effort=xhigh"]

# §14 auth markers, captured verbatim from a real failure on 2026-08-28
# against codex 0.150.1. Provoked without touching real credentials: point
# CODEX_HOME at an empty directory, so the CLI finds no auth of its own and
# ~/.codex is neither read nor written.
#
#   ERROR: unexpected status 401 Unauthorized: Missing bearer or basic
#   authentication in header, url: https://api.openai.com/v1/responses
#
# NOT the marker, and each for a specific reason:
#
#   exit 1 -- codex exits 1 for essentially every failure, including a
#     rejected sandbox write and a refused git-repo check. Claiming it here
#     would classify every one of those as an auth failure.
#   "Reconnecting... n/5" -- codex retries the same 401 five times over both
#     transports, so this appears on any transport trouble at all.
#   "failed to connect to websocket" -- printed for a plain network failure
#     too. The 401 inside that line is what distinguishes the two.
#
# 401 is safe to match on its own because it is the HTTP status reserved for
# authentication: a rate limit is 429 and a server fault is 5xx, so neither
# reaches this string. The longer sentence is kept first because it is
# unambiguous even if OpenAI ever reuses 401 for something else.
# Captured verbatim on 2026-09-09, when a review dispatched two friends and
# this one came back in five seconds:
#   {"type":"error","message":"You've hit your usage limit. Visit
#    https://chatgpt.com/codex/settings/usage to purchase more credits or
#    try again at Sep 14th, 2026 6:51 PM."}
# It is matched against the envelope's own error message rather than stderr,
# which held only the "Reading prompt from stdin..." banner.
[quota]
provider_error_contains = ["usage limit"]
remediation = "wait for the quota to reset, pick a model on a separate allowance (afriend providers models codex), or run this friend on another provider"

[auth]
stderr_contains = [
  "Missing bearer or basic authentication in header",
  "401 Unauthorized",
]
remediation = "run `codex login`, or set CODEX_HOME to a directory holding valid credentials"

# §12.2. codex has its own `--sandbox read-only`, which stops it writing and
# does nothing about what it can read -- a friend told to open
# ~/.ssh/id_ed25519 under read-only mode simply succeeds. Opting in adds the
# read protection its own flag does not provide.
#
# claude is the one CLI still trusted to confine itself. Its `--tools
# Read,Grep,Glob` allowlist was measured and does hold -- it reports no write
# tool and creates nothing -- so only the read gap above remains, and closing
# it is worse than the gap: claude keeps credentials in the macOS Keychain and
# reports "Not logged in" under any profile that does not grant
# ~/Library/Keychains, which would hand a friend every credential the operator
# has.
#
# agy used to be listed here as untested, because provoking its
# re-authentication had already cost one login. It has since been tested, and
# none of its flags restricted anything: it wrote files and read an absolute
# path outside its working directory. It is OS-confined now (see agy.toml),
# with ~/.gemini granted read and write so its token refresh still works --
# withholding that is what would have provoked the re-authentication.
[sandbox]
os_confine = true
readonly_workdir = true
# Codex 0.150.1 scans this global root during an actual turn even with
# --ignore-user-config. This narrow, read-only allowance is the measured
# startup dependency for a confined repository review; it does not grant the
# rest of ~/.agents. Apps and plugins remain disabled by argv above.
read = ["~/.codex", "~/.agents/skills"]
access_failure_stderr = ["codex_skills_extension::loader::host: failed to scan skill path"]
# codex writes session state, logs and its own sqlite files under CODEX_HOME
# on every run, and exits if it cannot.
write = ["~/.codex"]
