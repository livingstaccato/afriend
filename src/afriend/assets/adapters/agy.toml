# --print no longer carries the prompt. It did, and had to come last as a
# result; the prompt now arrives on stdin and --print takes an empty value
# in the middle of base_argv, with build_argv appending flags after it.
name = "agy"
binary = "agy"
# §12.2. `readonly_argv` being non-empty used to make this adapter both
# "read-only" and "self-confining" by inference, and inference was all it
# was: none of the flags it declared actually restricted the friend. It was
# therefore the one shipped adapter running with no OS confinement and no
# real restriction of its own. Confinement is declared explicitly now, the
# way codex declares it, and for the same reason codex gives: a CLI's own
# read-only mode says nothing about what it may READ.
#
# `readonly` is declared rather than inferred, and it is only true BECAUSE of
# the `[sandbox]` block below: `readonly_workdir` is what actually stops the
# friend writing its working tree. The loader enforces that pairing, which is
# how this file failed to load when confinement was added without it.
readonly = true
self_confines = false
# stdin, not the value of --print. As one argv element the prompt hit the
# same ~128KB single-argument cap on Linux that issue #4 documented for
# claude, and afriend was reduced to warning about its own dispatch.
#
# agy reads a prompt from stdin only under --input-format stream-json, which
# it refuses to pair with plain json output, so the answer arrives as an
# event stream too. --print still requires a value and accepts an empty one.
# Verified end to end against the installed CLI.
base_argv = [
  "--input-format", "stream-json",
  "--output-format", "stream-json",
  "--print", "",
]
prompt_mode = "stdin"
stdin_template = '{"event":"user","message":{"role":"user","content":[{"type":"text","text":{prompt}}]}}'
# Installed agy 1.1.22 documents these invocation-local controls in
# `agy --help`. Order within this list is free: --print is satisfied by the
# empty value in base_argv, and the prompt goes to stdin.
#
# NOT in this list, and deliberately: `--mode plan`. agy prints
# `warning: --mode plan has no effect while slash command expansion is
# disabled` on every run -- disabled by `--disable-slash-commands`, which is
# in this same list. It was inert, and an inert flag in the list that decides
# whether a friend is trusted to confine itself is worse than no flag at all.
#
# What remains here is defence in depth, not confinement. Measured against
# installed agy 1.1.22 with the reviewer agent staged exactly as dispatch
# stages it: the friend still wrote a file (relocated by `--sandbox` into
# ~/.gemini/antigravity-cli/scratch rather than blocked), and still read an
# absolute path outside its working directory. `tools: []` in the agent did
# not prevent tool use. See `[sandbox]` below for what actually confines it.
readonly_argv = [
  "--agent", "afriend-reviewer",
  "--disable-slash-commands",
  "--sandbox",
]
schema_flag = "--json-schema"
model_flag = "--model"
models_argv = ["models"]
models_format = "tsv"
internal_timeout_flag = "--print-timeout"
effort_kind = "native"
structured_output = true
# Authority evidence captured from installed agy 1.1.22 on 2026-08-30:
# `agy --help` exposes MCP/plugin management subcommands, plan mode, and a
# slash-command switch, but no invocation-local option that disables inherited
# MCP servers, plugins, and tools together. It therefore remains fail-closed.
external_tools = "uncontrolled"
deny_external_tools_argv = []
external_tool_sources = ["tools", "slash commands", "MCP servers", "plugins"]

# Direct validation with installed agy 1.1.23 confirms that Markdown agents
# support `tools`, `subagent`, `disable-model-invocation`, and the single
# `inheritCustomizations` switch. `subagent: false` prevents subagent
# discovery/invocation; `disable-model-invocation: true` is a distinct
# restriction. These controls are defense in depth and do not prove
# invocation-local denial of every inherited tool/plugin/MCP source, so
# external_tools remains uncontrolled.
[[workspace_assets]]
source = "harnesses/agy/afriend-reviewer.md"
target = ".agents/agents/afriend-reviewer/agent.md"
sha256 = "947843c36fc8f9e3793a32dccb435037ff3be287d383b0a943f5965e493372ab"

# §12.2. agy has no invocation-local flag that restricts either writes or
# reads -- both were measured, both succeeded -- so it runs under the OS
# confinement every non-self-confining friend gets.
#
# The allowances are agy's own state directory. It reads its credentials
# from there (gemini-credentials.json, oauth_creds.json, and the
# antigravity-cli oauth token) and writes logs, conversation state and its
# scratch directory on every run. Withholding them is what risks provoking a
# re-authentication, which has cost a login before -- so this is granted
# whole, exactly as codex is granted ~/.codex.
[sandbox]
os_confine = true
readonly_workdir = true
read = ["~/.gemini"]
write = ["~/.gemini"]

[effort]
low = ["--effort", "low"]
medium = ["--effort", "medium"]
high = ["--effort", "high"]

# Captured directly from `agy --output-format json`: the answer is the
# top-level "response" string; on error, "response" is empty and "error"
# carries the message instead (see normalize.py's module docstring). A
# missing/empty "response" makes json_path unwrapping report "found
# nothing," so normalize() falls back to scanning the raw envelope, which
# still degrades cleanly (structured_output=true keeps that fallback's
# failure message legible).
# stream-json closes with a `result` event carrying both the answer and,
# on the failure path, the reason. Declaring it terminal is what stops the
# wait: agy writes its result and then does not exit until --print-timeout
# elapses, which cost between seven and twelve minutes per hung run.
[envelope]
kind = "ndjson"
match_field = "event"
terminal_event = "result"

[[envelope.rules]]
type = "result"
field = "result.response"

# The findings array, which agy carries BESIDE the prose response in the same
# event. Under --json-schema the schema-conforming object arrives as the
# `response` string and this rule matches nothing; when it does not, a
# response full of unrelated prose used to fail the run with "no findings"
# while the findings sat one key away in the object already being read. A
# stream cannot rescan "one level up" the way the old json_path envelope
# could, so the recovery has to be declared.
[[envelope.rules]]
type = "result"
field = "result.findings"

[[envelope.error_rules]]
type = "result"
# Captured from a real run: {"event":"result","result":{"status":"ERROR",
# "response":"","error":"stream input ... is missing the \"message\" field"}}.
# Read only once normalizing has failed, so the failure reason leads with
# agy's own words instead of "the adapter may need an envelope path".
field = "result.error"

# Captured verbatim from a real failure: a crossexam run on 2026-08-26 whose
# agy login had lapsed. Exit status was 1 and stdout empty, so this sentence
# is the only place the failure is legible. The substring stops short of the
# trailing ", then retry." so a minor rewording of the tail cannot silently
# turn the marker off.
#
# NOT the marker: "Error: authentication timed out." -- that is what agy
# says when it cannot REACH the auth endpoint, and matching it would abort
# every network-denied run as an auth failure. See failures.py.
[auth]
stderr_contains = ["authentication required. Run 'agy' to log in"]
remediation = "run `agy` interactively to log in, then re-run"
