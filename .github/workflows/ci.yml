name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: quality (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # A run takes about four minutes. Fail a hang well inside GitHub's
    # six-hour default; pytest's faulthandler_timeout names the stuck test.
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      # act compat only (no-op on GitHub, where env.ACT is unset): the runner
      # image leaves RUNNER_TOOL_CACHE root-owned, and act runs JS actions as
      # its unprivileged runner user. Its post steps also run via a bare
      # `docker exec` that does not inherit the image's PATH. Prepare the cache
      # and expose node in a default docker-exec PATH entry so setup-uv can run
      # and clean up successfully. See https://github.com/nektos/act/issues/107
      - name: act compat — prepare JS action runtime
        if: ${{ env.ACT }}
        run: |
          sudo install -d -o "$(id -u)" -g "$(id -g)" "$RUNNER_TOOL_CACHE"
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TOOL_CACHE"
          sudo ln -sf "$(command -v node)" /usr/local/bin/node

      # Checkout source
      - uses: actions/checkout@v7

      # Install uv and the matrix Python (uv manages its own interpreters,
      # so we don't need actions/setup-python).
      #
      # Pinned to a concrete tag rather than a moving major: astral-sh/setup-uv
      # publishes moving `vN` tags only through v7, so `@v8`/`@v9`/`@v10` do
      # not resolve at all ("reference not found") even though v10.0.1 is the
      # current release. Bump this deliberately; `make act-ci` catches a bad
      # ref before it reaches CI.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}

      # Install dependencies (this package has none at runtime; --all-extras
      # pulls the dev dependency group: pytest, mypy, ruff)
      - run: uv sync --all-extras

      # Lint and format check
      - name: ruff format
        run: uv run ruff format --check .

      - name: ruff lint
        run: uv run ruff check .

      # Type check
      - name: mypy
        run: uv run mypy src

      # Enforce 777-line per-file cap (scripts/check_max_loc.py)
      - name: max-loc
        run: make max-loc

      # Verify plugins/ matches the packaged assets/ mirror
      - name: plugin-sync
        run: make plugin-sync

      # Verify VERSION matches every plugin manifest's version field
      - name: version-sync
        run: make version-sync

      # Install the pinned PlantUML release, rather than Ubuntu's 1.2020.02,
      # which parses these sources differently from the release they are
      # authored and rendered against. The script says why in full.
      - name: install plantuml
        run: ci/install_plantuml.sh

      # Verify every architecture diagram still renders. Nothing ran the
      # `diagrams` target automatically, and two sources were unrenderable
      # for days behind PNGs that could not be reproduced from them -- the
      # digest manifest only proves a PNG matches the .puml it was recorded
      # against, never that the .puml still parses.
      - name: diagrams-check
        run: make diagrams-check

      # Build the wheel and confirm every adapter, lens, and reference file
      # actually ships in it -- package-data misconfiguration is otherwise
      # silent until first run.
      - name: build wheel and verify assets
        run: ci/verify_wheel_assets.sh

      # Install that wheel and run the console script from outside the
      # checkout. Building proves it packs; installing proves it works, and
      # the two are not the same check -- the version the CLI reported
      # drifted two releases behind VERSION while every other check agreed,
      # because nothing here ever ran the installed entry point.
      - name: install wheel and run it
        run: ci/verify_wheel_install.sh

      # Install the Linux OS-confinement mechanism (§12.2). Without it the
      # real containment tests skip, and a skip looks exactly like a pass.
      - name: install sandbox mechanism
        run: ci/install_sandbox.sh

      # Tests
      - name: pytest
        run: uv run pytest -n 4

      # Run source-mutating probes only after pytest has finished in this
      # checkout, once on the newest supported Python rather than in parallel.
      - name: mutation-probe
        if: matrix.python-version == '3.13'
        run: make mutation-probe

      # Fail if the containment tests silently skipped -- the whole point of
      # installing bwrap above is that this path is actually exercised.
      - name: assert containment tests ran
        run: ci/assert_sandbox_tested.sh

  windows:
    name: windows
    # Separate from `quality` rather than added to its matrix: most of that
    # job's steps (plantuml, wheel-asset verification, bwrap containment) are
    # either Linux-sandbox-specific or already proven once on Linux, and
    # don't need a second, platform-irrelevant run here. This job exists so
    # Windows support -- landed as a large, mostly-mechanical port of every
    # POSIX-only primitive (process groups, secure file I/O, pipe pumping) to
    # its Windows equivalent -- cannot silently regress again.
    runs-on: windows-latest
    # Windows is slower than Linux, and its pytest step has sat for over half
    # an hour past its last progress line. Fail that in thirty minutes.
    timeout-minutes: 30
    env:
      # Every artifact this tool writes (reports, prompts) is explicit
      # UTF-8, but a bare `Path.read_text()`/`.write_text()` -- used freely
      # throughout the test suite itself, not just production code --
      # defaults to the Windows locale codepage instead, not UTF-8. Found
      # live: report.md's `·` separator round-tripped as U+FFFD through a
      # test's unadorned `.read_text()`. Forcing Python's UTF-8 mode here
      # makes that default UTF-8 everywhere for this job, rather than
      # auditing every read/write call site in the test suite for an
      # explicit encoding.
      PYTHONUTF8: "1"
    steps:
      # Checkout source
      - uses: actions/checkout@v7

      # Install uv and the oldest supported Python
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.11"

      # Install dependencies
      - run: uv sync --all-extras

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "lts/*"

      # Tests, one line per test as it finishes: a killed job never prints
      # pytest's failure summary, so this is the only record of what failed.
      # -vv, because pyproject's addopts pass -q and a single -v only cancels it.
      - name: pytest
        run: uv run pytest -n 4 -vv

  windows-cli-startup:
    name: Windows startup (${{ matrix.provider }})
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: claude
            version-variable: AF_STARTUP_CLAUDE_VERSION
          - provider: codex
            version-variable: AF_STARTUP_CODEX_VERSION
          - provider: opencode
            version-variable: AF_STARTUP_OPENCODE_VERSION
          - provider: pi
            version-variable: AF_STARTUP_PI_VERSION
    env:
      PYTHONUTF8: "1"
      AF_STARTUP_PROVIDER: ${{ matrix.provider }}
      # Follow current releases unless an operator explicitly sets an override.
      AF_PROVIDER_VERSION: ${{ vars[matrix.version-variable] || 'latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "lts/*"
      - run: uv sync --all-extras
      - name: Install real reviewer CLI
        shell: pwsh
        run: |
          $out = "artifacts/startup-$env:AF_STARTUP_PROVIDER"
          New-Item -ItemType Directory -Force $out | Out-Null
          $package = uv run python -c "import os,runpy; print(runpy.run_path('ci/provider_startup.py')['PROVIDERS'][os.environ['AF_STARTUP_PROVIDER']]['package'])"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $prefix = Join-Path $env:RUNNER_TEMP "afriend-reviewer-cli"
          $installArgs = @("install", "--global", "--prefix", $prefix, "--no-audit", "--no-fund")
          if ($env:AF_STARTUP_PROVIDER -eq "pi") { $installArgs += "--ignore-scripts" }
          $installArgs += "$package@$env:AF_PROVIDER_VERSION"
          npm @installArgs 2>&1 | Tee-Object "$out/npm-install.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm list --global --prefix $prefix --depth=0 --json | Out-File "$out/installed.json" -Encoding utf8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --version | Out-File "$out/node-version.txt" -Encoding utf8
          $prefix | Out-File $env:GITHUB_PATH -Append -Encoding utf8
      - name: Exercise native startup and expected rejection
        run: uv run python ci/provider_startup.py --provider ${{ matrix.provider }} --out artifacts/startup-${{ matrix.provider }} --require-windows
      - name: Upload startup evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-startup-${{ matrix.provider }}
          path: artifacts/startup-${{ matrix.provider }}/
          if-no-files-found: error
