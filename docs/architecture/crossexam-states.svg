"313.19" y="207.89" fill="#2D424E" font-size="12" textLength="52.908" font-family="'Avenir Next'">unproven</text></g><g class="entity" data-qualified-name="IN" id="ent0007" data-source-line="47"><rect x="737.61" y="532.65" width="82.076" height="50" fill="#EAF3F4" style="stroke:#7E99A3;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="737.61" y1="559.042" x2="819.686" y2="559.042" style="stroke:#7E99A3;stroke-width:0.5;"/><text x="747.61" y="549.65" fill="#2D424E" font-size="12" textLength="62.076" font-family="'Avenir Next'">incomplete</text></g><g class="entity" data-qualified-name="DIS" id="ent0008" data-source-line="48"><rect x="80.22" y="388.65" width="74.852" height="50" fill="#D9E8D5" style="stroke:#7E99A3;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="80.22" y1="415.042" x2="155.072" y2="415.042" style="stroke:#7E99A3;stroke-width:0.5;"/><text x="90.22" y="405.65" fill="#2D424E" font-size="12" textLength="54.852" font-family="'Avenir Next'">discarded</text></g><g class="start_entity" data-qualified-name=".start." id="ent0009" data-source-line="50"><ellipse cx="678.65" cy="215.89" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="end_entity" data-qualified-name=".end." id="ent0021" data-source-line="64"><ellipse cx="368.65" cy="706.24" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="368.65" cy="706.24" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN23" id="ent0024" data-source-line="67"><path d="M6,676.65 L6,735.826 A0,0 0 0 0 6,735.826 L199.296,735.826 A0,0 0 0 0 199.296,735.826 L199.296,686.65 L189.296,676.65 L106.65,676.65 L102.65,582.86 L98.65,676.65 L6,676.65 A0,0 0 0 0 6,676.65" style="stroke:#B3AA97;stroke-width:0.5;" fill="#F4F1E8"/><path d="M189.296,676.65 L189.296,686.65 L199.296,686.65 L189.296,676.65" style="stroke:#B3AA97;stroke-width:0.5;" fill="#F4F1E8"/><text x="12" y="693.65" fill="#4A4436" font-size="12" textLength="167.304" font-family="'Avenir Next'">Not a pass. The judges agreed</text><text x="12" y="710.042" fill="#4A4436" font-size="12" textLength="146.172" font-family="'Avenir Next'">the defect is real, so a gate</text><text x="12" y="726.434" fill="#4A4436" font-size="12" textLength="172.296" font-family="'Avenir Next'">needs a Resolution, not silence.</text></g><g class="entity" data-qualified-name="GMN26" id="ent0027" data-source-line="73"><path d="M497.02,676.65 L497.02,735.826 A0,0 0 0 0 497.02,735.826 L690.268,735.826 A0,0 0 0 0 690.268,735.826 L690.268,686.65 L680.268,676.65 L591.51,676.65 L567.77,582.86 L583.51,676.65 L497.02,676.65 A0,0 0 0 0 497.02,676.65" style="stroke:#B3AA97;stroke-width:0.5;" fill="#F4F1E8"/><path d="M680.268,676.65 L680.268,686.65 L690.268,686.65 L680.268,676.65" style="stroke:#B3AA97;stroke-width:0.5;" fill="#F4F1E8"/><text x="503.02" y="693.65" fill="#4A4436" font-size="12" textLength="150.252" font-family="'Avenir Next'">Never resolved by majority.</text><text x="503.02" y="710.042" fill="#4A4436" font-size="12" textLength="172.248" font-family="'Avenir Next'">Both sides are quoted verbatim</text><text x="503.02" y="726.434" fill="#4A4436" font-size="12" textLength="146.124" font-family="'Avenir Next'">and the call is the reader's.</text></g><g class="entity" data-qualified-name="GMN29" id="ent0030" data-source-line="79"><path d="M411.29,137.13 L411.29,211.89 L376.46,215.89 L411.29,219.89 L411.29,294.658 A0,0 0 0 0 411.29,294.658 L634.01,294.658 A0,0 0 0 0 634.01,294.658 L634.01,147.13 L624.01,137.13 L411.29,137.13 A0,0 0 0 0 411.29,137.13" style="stroke:#B3AA97;stroke-width:0.5;" fill="#F4F1E8"/><path d="M624.01,137.13 L624.01,147.13 L634.01,147.13 L624.01,137.13" style="stroke:#B3AA97;stroke-width:0.5;" fill="#F4F1E8"/><text x="417.29" y="154.13" fill="#4A4436" font-size="12" textLength="184.212" font-family="'Avenir Next'">A dispositive verdict whose judge</text><text x="417.29" y="170.522" fill="#4A4436" font-size="12" textLength="173.568" font-family="'Avenir Next'">could not locate the evidence is</text><text x="417.29" y="186.914" fill="#4A4436" font-size="12" textLength="201.72" font-family="'Avenir Next'">downgraded to unproven first (§6.5),</text><text x="417.29" y="203.306" fill="#4A4436" font-size="12" textLength="175.5" font-family="'Avenir Next'">so nobody settles a claim by not</text><text x="417.29" y="219.698" fill="#4A4436" font-size="12" textLength="81.252" font-family="'Avenir Next'">having looked.</text><text x="417.29" y="236.09" fill="#4A4436" font-size="12" font-family="'Avenir Next'"> </text><text x="417.29" y="252.482" fill="#4A4436" font-size="12" textLength="177.612" font-family="'Avenir Next'">A sandbox access failure instead</text><text x="417.29" y="268.874" fill="#4A4436" font-size="12" textLength="189.204" font-family="'Avenir Next'">leaves the claim incomplete: it was</text><text x="417.29" y="285.266" fill="#4A4436" font-size="12" textLength="194.1" font-family="'Avenir Next'">not assessed, and cannot discard it.</text></g><!--link *start* to C--><g class="link" data-entity-1="ent0009" data-entity-2="ent0001" id="lnk10" data-source-line="50" data-link-type="dependency"><path d="M676.97,226.13 C671.88,251.42 654.22,322.25 610.65,358.65 C583.46,381.37 550.213,394.221 522.123,402.341" style="stroke:#6E8288;stroke-width:1;" fill="none" id="*start*-to-C"/><polygon points="517.32,403.73,527.077,405.073,522.123,402.341,524.855,397.388,517.32,403.73" fill="#6E8288" style="stroke:#6E8288;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="639.31" y="345.65" fill="#5B7079" font-size="12" textLength="89.568" font-family="'Avenir Next'">round 1 raised it</text></g><!--link C to SU--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk11" data-source-line="52" data-link-type="dependency"><path d="M442.12,415.88 C362.91,419.19 182.1,430.79 135.65,468.65 C116.55,484.22 109.328,507.109 105.938,527.309" style="stroke:#6E8288;stroke-width:1;" fill=