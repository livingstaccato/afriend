<?plantuml 1.2026.0?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="743px" preserveAspectRatio="none" style="width:959px;height:743px;background:#FFFFFF;" version="1.1" viewBox="0 0 959 743" width="959px" zoomAndPan="magnify"><title>Claim states in cross-examination</title><defs/><g><g class="title" data-source-line="25"><text fill="#000000" font-family="'Helvetica'" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="303.6761" x="320.664" y="29.2419">Claim states in cross-examination</text></g><g class="legend" data-source-line="27"><rect fill="none" height="71.2038" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="232.0391" x="700.9649" y="57.5158"/><rect fill="#C8E6C9" height="19.0679" style="stroke:none;stroke-width:1;" width="14.5599" x="705.9649" y="64.5158"/><text fill="#000000" font-family="'Helvetica'" font-size="14" lengthAdjust="spacing" textLength="14.5599" x="705.9649" y="79.4818">&#160;&#160;&#160;&#160;</text><text fill="#000000" font-family="'Helvetica'" font-size="14" lengthAdjust="spacing" textLength="146.0614" x="724.1648" y="79.4818">terminal, clears a gate</text><rect fill="#FFCDD2" height="19.0679" style="stroke:none;stroke-width:1;" width="14.5599" x="705.9649" y="83.5838"/><text fill="#000000" font-family="'Helvetica'" font-size="14" lengthAdjust="spacing" textLength="14.5599" x="705.9649" y="98.5497">&#160;&#160;&#160;&#160;</text><text fill="#000000" font-family="'Helvetica'" font-size="14" lengthAdjust="spacing" textLength="164.7374" x="724.1648" y="98.5497">terminal, needs a human</text><rect fill="#ECEFF1" height="19.0679" style="stroke:none;stroke-width:1;" width="14.5599" x="705.9649" y="102.6517"/><text fill="#000000" font-family="'Helvetica'" font-size="14" lengthAdjust="spacing" textLength="14.5599" x="705.9649" y="117.6176">&#160;&#160;&#160;&#160;</text><text fill="#000000" font-family="'Helvetica'" font-size="14" lengthAdjust="spacing" textLength="200.1992" x="724.1648" y="117.6176">another round could change it</text><line style="stroke:#000000;stroke-width:1;" x1="705.9649" x2="928.004" y1="64.5158" y2="64.5158"/><line style="stroke:#000000;stroke-width:1;" x1="705.9649" x2="928.004" y1="83.5838" y2="83.5838"/><line style="stroke:#000000;stroke-width:1;" x1="705.9649" x2="928.004" y1="102.6517" y2="102.6517"/><line style="stroke:#000000;stroke-width:1;" x1="705.9649" x2="928.004" y1="121.7196" y2="121.7196"/><line style="stroke:#000000;stroke-width:1;" x1="705.9649" x2="705.9649" y1="64.5158" y2="121.7196"/><line style="stroke:#000000;stroke-width:1;" x1="720.5248" x2="720.5248" y1="64.5158" y2="121.7196"/><line style="stroke:#000000;stroke-width:1;" x1="928.004" x2="928.004" y1="64.5158" y2="121.7196"/></g><g><rect fill="#ECEFF1" height="50" rx="12.5" ry="12.5" style="stroke:#546E7A;stroke-width:0.5;" width="75.7644" x="432.24" y="395.8196"/><line style="stroke:#546E7A;stroke-width:0.5;" x1="432.24" x2="508.0044" y1="422.1637" y2="422.1637"/><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="55.7644" x="442.24" y="413.6477">contested</text></g><g><rect fill="#FFCDD2" height="50" rx="12.5" ry="12.5" style="stroke:#546E7A;stroke-width:0.5;" width="101.7446" x="54.25" y="536.8196"/><line style="stroke:#546E7A;stroke-width:0.5;" x1="54.25" x2="155.9946" y1="563.1637" y2="563.1637"/><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="81.7446" x="64.25" y="554.6477">settled-upheld</text></g><g><rect fill="#C8E6C9" height="50" rx="12.5" ry="12.5" style="stroke:#546E7A;stroke-width:0.5;" width="104.0366" x="199.1" y="536.8196"/><line style="stroke:#546E7A;stroke-width:0.5;" x1="199.1" x2="303.1366" y1="563.1637" y2="563.1637"/><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="84.0366" x="209.1" y="554.6477">settled-refuted</text></g><g><rect fill="#C8E6C9" height="50" rx="12.5" ry="12.5" style="stroke:#546E7A;stroke-width:0.5;" width="86.3125" x="345.96" y="536.8196"/><line style="stroke:#546E7A;stroke-width:0.5;" x1="345.96" x2="432.2725" y1="563.1637" y2="563.1637"/><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="66.3125" x="355.96" y="554.6477">superseded</text></g><g><rect fill="#FFCDD2" height="50" rx="12.5" ry="12.5" style="stroke:#546E7A;stroke-width:0.5;" width="84.9325" x="504.65" y="536.8196"/><line style="stroke:#546E7A;stroke-width:0.5;" x1="504.65" x2="589.5825" y1="563.1637" y2="563.1637"/><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="64.9325" x="514.65" y="554.6477">deadlocked</text></g><g><rect fill="#ECEFF1" height="50" rx="12.5" ry="12.5" style="stroke:#546E7A;stroke-width:0.5;" width="74.7084" x="287.77" y="201.2696"/><line style="stroke:#546E7A;stroke-width:0.5;" x1="287.77" x2="362.4784" y1="227.6137" y2="227.6137"/><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="54.7084" x="297.77" y="219.0977">unproven</text></g><g><rect fill="#ECEFF1" height="50" rx="12.5" ry="12.5" style="stroke:#546E7A;stroke-width:0.5;" width="83.0965" x="714.57" y="536.8196"/><line style="stroke:#546E7A;stroke-width:0.5;" x1="714.57" x2="797.6665" y1="563.1637" y2="563.1637"/><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="63.0965" x="724.57" y="554.6477">incomplete</text></g><g><rect fill="#C8E6C9" height="50" rx="12.5" ry="12.5" style="stroke:#546E7A;stroke-width:0.5;" width="75.2004" x="85.52" y="395.8196"/><line style="stroke:#546E7A;stroke-width:0.5;" x1="85.52" x2="160.7204" y1="422.1637" y2="422.1637"/><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="55.2004" x="95.52" y="413.6477">discarded</text></g><ellipse cx="670.12" cy="226.2696" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><ellipse cx="361.12" cy="707.3296" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="361.12" cy="707.3296" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><g class="entity" data-qualified-name="GMN2" data-source-line="59" id="ent0003"><path d="M6,677.8196 L6,736.8519 A0,0 0 0 0 6,736.8519 L204.2413,736.8519 A0,0 0 0 0 204.2413,736.8519 L204.2413,687.8196 L194.2413,677.8196 L109.12,677.8196 L105.12,587.1596 L101.12,677.8196 L6,677.8196 A0,0 0 0 0 6,677.8196" fill="#FFF8E1" style="stroke:#F9A825;stroke-width:0.5;"/><path d="M194.2413,677.8196 L194.2413,687.8196 L204.2413,687.8196 L194.2413,677.8196" fill="#FFF8E1" style="stroke:#F9A825;stroke-width:0.5;"/><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="170.4972" x="12" y="695.6477">Not a pass. The judges agreed</text><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="150.9371" x="12" y="711.9918">the defect is real, so a gate</text><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="177.2413" x="12" y="728.3359">needs a Resolution, not silence.</text></g><g class="entity" data-qualified-name="GMN5" data-source-line="65" id="ent0006"><path d="M479.82,677.8196 L479.82,736.8519 A0,0 0 0 0 479.82,736.8519 L678.4213,736.8519 A0,0 0 0 0 678.4213,736.8519 L678.4213,687.8196 L668.4213,677.8196 L576.67,677.8196 L552.55,587.1596 L568.67,677.8196 L479.82,677.8196 A0,0 0 0 0 479.82,677.8196" fill="#FFF8E1" style="stroke:#F9A825;stroke-width:0.5;"/><path d="M668.4213,677.8196 L668.4213,687.8196 L678.4213,687.8196 L668.4213,677.8196" fill="#FFF8E1" style="stroke:#F9A825;stroke-width:0.5;"/><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="154.6691" x="485.82" y="695.6477">Never resolved by majority.</text><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="177.6013" x="485.82" y="711.9918">Both sides are quoted verbatim</text><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="150.9131" x="485.82" y="728.3359">and the call is the reader's.</text></g><g class="entity" data-qualified-name="GMN8" data-source-line="71" id="ent0009"><path d="M397.3,147.7196 L397.3,222.2696 L362.9,226.2696 L397.3,230.2696 L397.3,304.8166 A0,0 0 0 0 397.3,304.8166 L624.9414,304.8166 A0,0 0 0 0 624.9414,304.8166 L624.9414,157.7196 L614.9414,147.7196 L397.3,147.7196 A0,0 0 0 0 397.3,147.7196" fill="#FFF8E1" style="stroke:#F9A825;stroke-width:0.5;"/><path d="M614.9414,147.7196 L614.9414,157.7196 L624.9414,157.7196 L614.9414,147.7196" fill="#FFF8E1" style="stroke:#F9A825;stroke-width:0.5;"/><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="187.2014" x="403.3" y="165.5477">A dispositive verdict whose judge</text><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="176.8813" x="403.3" y="181.8918">could not locate the evidence is</text><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="206.6414" x="403.3" y="198.2359">downgraded to unproven first (&#167;6.5),</text><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="180.4813" x="403.3" y="214.58">so nobody settles a claim by not</text><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="82.6446" x="403.3" y="230.9241">having looked.</text><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="3.12" x="403.3" y="247.2683">&#160;</text><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="182.5933" x="403.3" y="263.6124">A sandbox access failure instead</text><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="194.8814" x="403.3" y="279.9565">leaves the claim incomplete: it was</text><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="200.6054" x="403.3" y="296.3006">not assessed, and cannot discard it.</text></g><!--link *start* to C--><g class="link" data-entity-1="ent0002" data-entity-2="ent0002" data-link-type="dependency" data-source-line="42" id="lnk3"><path d="M667.96,236.3096 C664.15,251.2596 655.38,281.7296 642.12,304.8196 C624.52,335.4596 619.31,344.5096 591.12,365.8196 C566.16,384.6796 539.2143,396.7043 514.1443,405.7443" fill="none" id="*start*-to-C" style="stroke:#37474F;stroke-width:1;"/><polygon fill="#37474F" points="508.5,407.7796,518.3232,408.4895,513.2036,406.0835,515.6095,400.9639,508.5,407.7796" style="stroke:#37474F;stroke-width:1;"/><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="85.0294" x="624.07" y="355.0785">round 1 raised it</text></g><!--link C to SU--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="44" id="lnk4"><path d="M432.02,423.4096 C354.88,427.3596 183.75,440.0196 139.12,475.8196 C120.65,490.6296 113.3309,511.115 109.4609,530.565" fill="none" id="C-to-SU" style="stroke:#37474F;stroke-width:1;"/><polygon fill="#37474F" points="108.29,536.4496,113.9694,528.4032,109.2657,531.5457,106.1232,526.842,108.29,536.4496" style="stroke:#37474F;stroke-width:1;"/><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="104.3562" x="140.12" y="488.5785">judges unanimously</text><text fill="#000000" font-family="'Helvetica'" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="38.2357" x="173.1803" y="503.5604">upheld</text></g><!--link C to SR--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" data-link-type="dependency" data-source-line="45" id="lnk5"><path d="M43