 x="242.7069" y="2242.8484">workspace assets inside this isolation dir</text><rect fill="#ECEFF1" height="37.706" rx="12.5" ry="12.5" style="stroke:#546E7A;stroke-width:1;" width="303.5562" x="216.3269" y="2289.3634"/><text fill="#000000" font-family="'Helvetica'" font-size="13" lengthAdjust="spacing" textLength="283.5562" x="226.3269" y="2313.2604">re-enforce this provider's authority at dispatch</text><rect fill="#ECEFF1" height="37.706" rx="12.5" ry="12.5" style="stroke:#546E7A;stroke-width:1;" width="269.8992" x="233.1554" y="2347.0694"/><text fill="#000000" font-family="'Helvetica'" font-size="13" lengthAdjust="spacing" textLength="249.8992" x="243.1554" y="2370.9664">build argv and filtered child environment</text><rect fill="#ECEFF1" height="55.412" rx="12.5" ry="12.5" style="stroke:#546E7A;stroke-width:1;" width="255.7942" x="240.2079" y="2404.7754"/><text fill="#000000" font-family="'Helvetica'" font-size="13" lengthAdjust="spacing" textLength="235.7942" x="250.2079" y="2428.6724">probe the OS confinement mechanism</text><text fill="#000000" font-family="'Helvetica'" font-size="13" lengthAdjust="spacing" textLength="165.2692" x="250.2079" y="2446.3785">BEFORE screening the argv</text><polygon fill="#FFF8E1" points="306.3886,2480.1875,429.8214,2480.1875,441.8214,2492.1875,429.8214,2504.1875,306.3886,2504.1875,294.3886,2492.1875,306.3886,2480.1875" style="stroke:#F57F17;stroke-width:1;"/><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="123.4328" x="306.3886" y="2496.8435">mechanism available?</text><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="18.6361" x="275.7524" y="2488.6714">yes</text><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="14.6761" x="441.8214" y="2488.6714">no</text><rect fill="#ECEFF1" height="126.2361" rx="12.5" ry="12.5" style="stroke:#546E7A;stroke-width:1;" width="342.2701" x="28.3785" y="2514.1875"/><text fill="#000000" font-family="'Helvetica'" font-size="13" lengthAdjust="spacing" textLength="229.2682" x="38.3785" y="2538.0845">apply adapter read-only controls and,</text><text fill="#000000" font-family="'Helvetica'" font-size="13" lengthAdjust="spacing" textLength="235.5472" x="38.3785" y="2555.7905">where declared, an outer read-only OS</text><text fill="#000000" font-family="'Helvetica'" font-size="13" lengthAdjust="spacing" textLength="264.5502" x="38.3785" y="2573.4965">policy; Codex uses the outer policy because</text><text fill="#000000" font-family="'Helvetica'" font-size="13" lengthAdjust="spacing" textLength="292.5003" x="38.3785" y="2591.2025">macOS command sandboxes cannot nest; Linux</text><text fill="#000000" font-family="'Helvetica'" font-size="13" lengthAdjust="spacing" textLength="225.0691" x="38.3785" y="2608.9085">bwrap exposes a safe resolver target</text><text fill="#000000" font-family="'Helvetica'" font-size="13" lengthAdjust="spacing" textLength="322.2701" x="38.3785" y="2626.6146">read-only when /etc/resolv.conf resolves outside /etc</text><rect fill="#FFE0B2" height="73.118" rx="12.5" ry="12.5" style="stroke:#546E7A;stroke-width:1;" width="292.0955" x="390.6486" y="2514.1875"/><text fill="#000000" font-family="'Helvetica'" font-size="13" lengthAdjust="spacing" textLength="247.4292" x="400.6486" y="2538.0845">drop any flag justified only by that policy</text><text fill="#000000" font-family="'Helvetica'" font-size="13" lengthAdjust="spacing" textLength="42.185" x="400.6486" y="2555.7905">(Codex</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="219.1465" x="446.2137" y="2556.5336">--sandbox&#160;danger-full-access</text><text fill="#000000" font-family="'Helvetica'" font-size="13" lengthAdjust="spacing" textLength="7.384" x="665.3602" y="2555.7905">),</text><text fill="#000000" font-family="'Helvetica'" font-size="13" lengthAdjust="spacing" textLength="205.4262" x="400.6486" y="2