<text x="176.21" y="327.606" fill="#4A4436" font-size="12" textLength="218.532" font-family="'Avenir Next'">Nothing else — deliberate under-merge.</text><line x1="289.976" y1="380.782" x2="331.976" y2="380.782" style="stroke:#6E8288;stroke-width:1;"/><line x1="331.976" y1="380.782" x2="331.976" y2="393.782" style="stroke:#6E8288;stroke-width:1;"/><line x1="290.976" y1="393.782" x2="331.976" y2="393.782" style="stroke:#6E8288;stroke-width:1;"/><polygon points="300.976,389.782,290.976,393.782,300.976,397.782,296.976,393.782" fill="#6E8288" style="stroke:#6E8288;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="317.85" y="357.998" fill="#5B7079" font-size="12" textLength="75.972" font-family="'Avenir Next'">keys match →</text><text x="296.976" y="374.39" fill="#5B7079" font-size="12" textLength="117.72" font-family="'Avenir Next'">c-0002 aliases c-0001</text><line x1="289.976" y1="440.566" x2="331.976" y2="440.566" style="stroke:#6E8288;stroke-width:1;"/><line x1="331.976" y1="440.566" x2="331.976" y2="453.566" style="stroke:#6E8288;stroke-width:1;"/><line x1="290.976" y1="453.566" x2="331.976" y2="453.566" style="stroke:#6E8288;stroke-width:1;"/><polygon points="300.976,449.566,290.976,453.566,300.976,457.566,296.976,453.566" fill="#6E8288" style="stroke:#6E8288;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="300.39" y="417.782" fill="#5B7079" font-size="12" textLength="123.66" font-family="'Avenir Next'">c-0001.origin grows to</text><text x="296.976" y="434.174" fill="#5B7079" font-size="12" textLength="130.488" font-family="'Avenir Next'">[fake/security, fake/ops]</text><polygon points="422.464,479.958,432.464,483.958,422.464,487.958,426.464,483.958" fill="#6E8288" style="stroke:#6E8288;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="289.976" y1="483.958" x2="428.464" y2="483.958" style="stroke:#6E8288;stroke-width:1;"/><text x="304.302" y="477.566" fill="#5B7079" font-size="12" textLength="115.836" font-family="'Avenir Next'">append claim c-0001</text><polygon points="422.464,526.742,432.464,530.742,422.464,534.742,426.464,530.742" fill="#6E8288" style="stroke:#6E8288;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="289.976" y1="530.742" x2="428.464" y2="530.742" style="stroke:#6E8288;stroke-width:1;"/><text x="304.302" y="507.958" fill="#5B7079" font-size="12" textLength="115.836" font-family="'Avenir Next'">append claim c-0002</text><text x="308.43" y="524.35" fill="#5B7079" font-size="12" textLength="107.58" font-weight="700" font-family="'Avenir Next'">(the duplicate too)</text><polygon points="422.464,589.918,432.464,593.918,422.464,597.918,426.464,593.918" fill="#6E8288" style="stroke:#6E8288;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="289.976" y1="593.918" x2="428.464" y2="593.918" style="stroke:#6E8288;stroke-width:1;"/><text x="327.072" y="554.742" fill="#5B7079" font-size="12" textLength="70.296" font-family="'Avenir Next'">append alias</text><text x="313.326" y="571.134" fill="#5B7079" font-size="12" textLength="97.788" font-family="'Avenir Next'">canonical=c-0001</text><text x="313.716" y="587.526" fill="#5B7079" font-size="12" textLength="97.008" font-family="'Avenir Next'">duplicate=c-0002</text><path d="M301.054,606.918 L301.054,681.918 L567.054,681.918 L567.054,616.918 L557.054,606.918 L301.054,606.918" style="stroke:#B3AA97;stroke-width:0.5;" fill="#F4F1E8"/><path d="M557.054,606.918 L557.054,616.918 L567.054,616.918 L557.054,606.918" style="stroke:#B3AA97;stroke-width:0.5;" fill="#F4F1E8"/><text x="307.054" y="623.918" fill="#4A4436" font-size="12" textLength="236.412" font-family="'Avenir Next'">The duplicate's own claim record is written,</text><text x="307.054" y="640.31" fill="#4A4436" font-size="12" textLength="232.128" font-family="'Avenir Next'">not just the alias. Otherwise alias.duplicate</text><text x="307.054" y="656.702" fill="#4A4436" font-size="12" textLength="245.82" font-family="'Avenir Next'">would dangle and a reader could not rebuild</text><text x="307.054" y="673.094" fill="#4A4436" font-size="12" textLength="201.588" font-family="'Avenir Next'">corroboration from the ledger alone.</text><polygon points="510.59,705.878,520.59,709.878,510.59,713.878,514.59,709.878" fill="#6E8288" style="stroke:#6E8288;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="289.976" y1="709.878" x2="516.59" y2="709.878" style="stroke:#6E8288;stroke-width:1;"/><text x="352.619" y="703.486" fill="#5B7079" font-size="12" textLength="107.328" font-family="'Avenir Next'">one finding, ranked</text><line x1="522.59" y1="773.054" x2="564.59" y2="773.054" style="stroke:#6E8288;stroke-width:1;"/><line x1="564.59" y1="773.054" x2="564.59" y2="786.054" style="stroke:#6E8288;stroke-width:1;"/><line x1="523.59" y1="786.054" x2="564.59" y2="786.054" style="stroke:#6E8288;stroke-width:1;"/><polygon points="533.59,782.054,523.59,786.054,533.59,790.054,529.59,786.054" fill="#6E8288" style="stroke:#6E8288;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="583.518" y="733.878" fill="#5B7079" font-size="12" textLength="42.312" font-family="'Avenir Next'">renders</text><text x="529.59" y="750.27" fill="#5B7079" font-size="12" textLength="150.168" font-family="'Avenir Next'">"corroborated by 2 friends"</text><text x="541.53" y="766.662" fill="#5B7079" font-size="12" textLength="126.288" font-family="'Avenir Next'">fake/security · fake/ops</text><path d="M389.522,799.054 L389.522,874.054 L655.522,874.054 L655.522,809.054 L645.522,799.054 L389.522,799.054" style="stroke:#B3AA97;stroke-width:0.5;" fill="#D9E8D5"/><path d="M645.522,799.054 L645.522,809.054 L655.522,809.054 L645.522,799.054" style="stroke:#B3AA97;stroke-width:0.5;" fill="#D9E8D5"/><text x="395.522" y="816.054" fill="#4A4436" font-size="12" textLength="245.136" font-family="'Avenir Next'">Two independent models reaching the same</text><text x="395.522" y="832.446" fill="#4A4436" font-size="12" textLength="202.704" font-family="'Avenir Next'">conclusion is the strongest signal this</text><text x="395.522" y="848.838" fill="#4A4436" font-size="12" textLength="213.684" font-family="'Avenir Next'">tool produces — so it is never collapsed</text><text x="395.522" y="865.23" fill="#4A4436" font-size="12" textLength="172.644" font-family="'Avenir Next'">into a single unattributed claim.</text><?plantuml-src XLRTRjf85BxtKnpHYxHHW0H8Gges4X38LahIAedsPbDjn_R1J6FFU6V6eTchlTe7MEsxxFq-Ifzalx61c42pI23i-URyVETtXtxISv8gvfpnennDyI1LOYdaI6TCMZ55sXWTQYCSnnIbGcQjO8TkZOZmB18XbNLaJTGMKoCXfvsnIRYLFz9h_YOYzslv_8Q4Yd6l3amvJjW0sGgyn1bd_1RgKbqOIrPaEG0qDJgZM4UsBJEHi6s71fAMCfgfJdJpyA3JobNYxHeyi9A6hlYRynhfPaANMccoCvdJNBePPIBwU5EU2SCaGbiwxhMu6TFe0vb2AJPx43QVoMW64j97YcOStLj01EIIXOaHa_6qmTPcixmBoZBfF4sVhiuhxJ-VKowaWInfAJSwBZnhuIDzoSGzKon5OaHclq09nCAqcGJbfPQPyEeOR0VsNgfS04YXYEuJemiLZy2JeLUJybD3n3mLHUecMhahWH0sQemqDd6U79lxM3xTM73Ms2xrHlxETD2j7TgPYFKSUKDJaLgkdGoGElE5fKVZVgVVVtxe9Iu0XyFZ_UEJRO1APQTsT2jToaz79zkE5c8xPxrERrm3f9mWRiCD9lkJqMIqYTC6CLvW1lrHTxI9sMwZqeutjVGc1-F-SrHTnx0x69mSFqFK_EaDUhtkqPRpJGii_rQmYlYIhKNj35APA8gGxsngg4_2E1d9N2YtPiZn-EHaqFq1yBbVuy6aE-bj1xyKZ6UmpUGw4qw4mlBBfgrG_slNpOAJ2pd5L_7ByLsYjoHou7oYbItqgKLArB4jp8DyO8kYYOiybL7vEWZo9rUfKRKl6jmfor5Xf7j4BYdR85JzW5wTdOpxPuTRhmplbCxj4tgu7LthlINiCeWN756ZxEAszTMYjTqfaVlst_HjhaHU84kFniUZ_hf0mxashfN59UWw20RKFALBUbiD1OgQ-_lx1tUguLjXKWWJ-vwNIMlH6HemsiX4AdfFlqpH-jfBjpy7moroEf23WK3dfPmFbkZoHu90nkSWy4L0-e4D72KwyypJFJ-YE4mcKcILfTrTx-Bkhc_hZikc1oYwlIrxTGHgzYXF2-iRl3EO5mXcgglmjG2zqcxcknoZoT7tF_v6W5CPif-CLFX9qAn6N-33v0qAWikbRx05P0Y7UVBzpx_kLEKbmJIejGlodk3LSslXAZ9wZc6WxzGwTtjKOw2yUu6xLJpNelBI8QX-5vw-zb5RfYicaDPlthN3qusBfS4mNoYj04tVByE-kbkzwTH3SW7oRkloTopfkLfOOR1hLCaoDtvygZt0SPc-5jWil5sbqXPzn7ypbtRvOYKE-BakqfXYeHBKP3dS8LSW9YXEV-Bb6GuBcSP0hnViQlXN2mcaO-_PYE8rIF3xq697sYFi8VSS1zVBmyKsWCnTMvamx3jKrQv5zgu5aFxzPnN2Ec7Ngve6SNEzjgDb6cbdlNTHcOtUS2nBNBgb8kIlzqdQwi0PhR0rOKD3xnSfNaeB9EARBlSHM-QoXHRdhob-A5bBKv5Rzcn9vRIl2LcIMoZXK1rXKTi7LrJz1m00?></g></svg>