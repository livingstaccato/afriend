y-2="part3" id="msg1"><polygon fill="#37474F" points="269.9832,188.8735,279.9832,192.8735,269.9832,196.8735,273.9832,192.8735" style="stroke:#37474F;stroke-width:1;"/><line style="stroke:#37474F;stroke-width:1;" x1="50.103" x2="275.9832" y1="192.8735" y2="192.8735"/><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="64.2615" x="133.9124" y="157.6868">claim c-0001</text><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="113.7392" x="109.1735" y="172.6687">"the guard is missing"</text><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="116.3242" x="107.8811" y="187.6506">origin = [fake/security]</text></g><g class="message" data-entity-1="part2" data-entity-2="part3" id="msg2"><polygon fill="#37474F" points="269.9832,247.8192,279.9832,251.8192,269.9832,255.8192,273.9832,251.8192" style="stroke:#37474F;stroke-width:1;"/><line style="stroke:#37474F;stroke-width:1;" x1="137.4131" x2="275.9832" y1="251.8192" y2="251.8192"/><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="64.2615" x="177.5674" y="216.6325">claim c-0002</text><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="120.5701" x="149.4131" y="231.6143">"The Guard Is  Missing"</text><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="94.5003" x="162.448" y="246.5962">origin = [fake/ops]</text></g><path d="M157,264.8192 L157,323.8192 L406,323.8192 L406,274.8192 L396,264.8192 L157,264.8192" fill="#FFF8E1" style="stroke:#F9A825;stroke-width:0.5;"/><path d="M396,264.8192 L396,274.8192 L406,274.8192 L396,264.8192" fill="#FFF8E1" style="stroke:#F9A825;stroke-width:0.5;"/><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="125.1729" x="163" y="282.6473">Dedup key normalizes</text><text fill="#000000" font-family="'Helvetica'" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="25.8002" x="291.2929" y="282.6473">only</text><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="63.4324" x="320.2131" y="282.6473">whitespace</text><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="215.8575" x="163" y="298.9914">runs and case, plus a strip on location.</text><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="228.2657" x="163" y="315.3355">Nothing else &#8212; deliberate under-merge.</text><g class="message" data-entity-1="part3" data-entity-2="part3" id="msg3"><line style="stroke:#37474F;stroke-width:1;" x1="281.9832" x2="323.9832" y1="364.8153" y2="364.8153"/><line style="stroke:#37474F;stroke-width:1;" x1="323.9832" x2="323.9832" y1="364.8153" y2="377.8153"/><line style="stroke:#37474F;stroke-width:1;" x1="282.9832" x2="323.9832" y1="377.8153" y2="377.8153"/><polygon fill="#37474F" points="292.9832,373.8153,282.9832,377.8153,292.9832,381.8153,288.9832,377.8153" style="stroke:#37474F;stroke-width:1;"/><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="69.9155" x="308.2551" y="344.6105">keys match &#8594;</text><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="108.4592" x="288.9832" y="359.5923">c-0002 aliases c-0001</text></g><g class="message" data-entity-1="part3" data-entity-2="part3" id="msg4"><line style="stroke:#37474F;stroke-width:1;" x1="281.9832" x2="323.9832" y1="421.7791" y2="421.7791"/><line style="stroke:#37474F;stroke-width:1;" x1="323.9832" x2="323.9832" y1="421.7791" y2="434.7791"/><line style="stroke:#37474F;stroke-width:1;" x1="282.9832" x2="323.9832" y1="434.7791" y2="434.7791"/><polygon fill="#37474F" points="292.9832,430.7791,282.9832,434.7791,292.9832,438.7791,288.9832,434.7791" style="stroke:#37474F;stroke-width:1;"/><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="115.5982" x="293.4327" y="401.5742">c-0001.origin grows to</text><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="124.4971" x="288.9832" y="416.5561">[fake/security, fake/ops]</text></g><g class="message" data-entity-1="part3" data-entity-2="part4" id="msg5"><polygon fill="#37474F" points="408.4803,459.761,418.4803,463.761,408.4803,467.761,412.4803,463.761" style="stroke:#37474F;stroke-width:1;"/><line style="stroke:#37474F;stroke-width:1;" x1="281.9832" x2="414.4803" y1="463.761" y2="463.761"/><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="106.5892" x="297.9372" y="458.538">append claim c-0001</text></g><g class="message" data-entity-1="part3" data-entity-2="part4" id="msg6"><polygon fill="#37474F" points="408.4803,503.7248,418.4803,507.7248,408.4803,511.7248,412.4803,507.7248" style="stroke:#37474F;stroke-width:1;"/><line style="stroke:#37474F;stroke-width:1;" x1="281.9832" x2="414.4803" y1="507.7248" y2="507.7248"/><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="106.5892" x="297.9372" y="487.5199">append claim c-0002</text><text fill="#000000" font-family="'Helvetica'" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="101.5073" x="300.4781" y="502.5018">(the duplicate too)</text></g><g class="message" data-entity-1="part3" data-entity-2="part4" id="msg7"><polygon fill="#37474F" points="408.4803,562.6704,418.4803,566.6704,408.4803,570.6704,412.4803,566.6704" style="stroke:#37474F;stroke-width:1;"/><line style="stroke:#37474F;stroke-width:1;" x1="281.9832" x2="414.4803" y1="566.6704" y2="566.6704"/><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="65.6145" x="318.4245" y="531.4837">append alias</text><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="89.1103" x="306.6766" y="546.4656">canonical=c-0001</text><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="87.9113" x="307.2761" y="561.4475">duplicate=c-0002</text></g><path d="M284,579.6704 L284,654.6704 L556,654.6704 L556,589.6704 L546,579.6704 L284,579.6704" fill="#FFF8E1" style="stroke:#F9A825;stroke-width:0.5;"/><path d="M546,579.6704 L546,589.6704 L556,589.6704 L546,579.6704" fill="#FFF8E1" style="stroke:#F9A825;stroke-width:0.5;"/><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="243.4697" x="290" y="597.4985">The duplicate's own claim record is written,</text><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="240.8057" x="290" y="613.8426">not just the alias. Otherwise alias.duplicate</text><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="251.0298" x="290" y="630.1867">would dangle and a reader could not rebuild</text><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="208.0215" x="290" y="646.5309">corroboration from the ledger alone.</text><g class="message" data-entity-1="part3" data-entity-2="part5" id="msg8"><polygon fill="#37474F" points="497.9654,677.0288,507.9654,681.0288,497.9654,685.0288,501.9654,681.0288" style="stroke:#37474F;stroke-width:1;"/><line style="stroke:#37474F;stroke-width:1;" x1="281.9832" x2="503.9654" y1="681.0288" y2="681.0288"/><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="101.2653" x="345.3417" y="675.8058">one finding, ranked</text></g><g class="message" data-entity-1="part5" data-entity-2="part5" id="msg9"><line style="stroke:#37474F;stroke-width:1;" x1="509.9654" x2="551.9654" y1="739.9744" y2="739.9744"/><line style="stroke:#37474F;stroke-width:1;" x1="551.9654" x2="551.9654" y1="739.9744" y2="752.9744"/><line style="stroke:#37474F;stroke-width:1;" x1="510.9654" x2="551.9654" y1="752.9744" y2="752.9744"/><polygon fill="#37474F" points="520.9654,748.9744,510.9654,752.9744,520.9654,756.9744,516.9654,752.9744" style="stroke:#37474F;stroke-width:1;"/><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="40.3257" x="567.389" y="704.7877">renders</text><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="141.173" x="516.9654" y="719.7696">"corroborated by 2 friends"</text><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="120.1191" x="527.4923" y="734.7515">fake/security &#183; fake/ops</text></g><path d="M373,765.9744 L373,840.9744 L645,840.9744 L645,775.9744 L635,765.9744 L373,765.9744" fill="#E8F5E9" style="stroke:#F9A825;stroke-width:0.5;"/><path d="M635,765.9744 L635,775.9744 L645,775.9744 L635,765.9744" fill="#E8F5E9" style="stroke:#F9A825;stroke-width:0.5;"/><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="251.0658" x="379" y="783.8025">Two independent models reaching the same</text><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="211.1895" x="379" y="800.1466">conclusion is the strongest signal this</text><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="222.9617" x="379" y="816.4908">tool produces &#8212; so it is never collapsed</text><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="179.4973" x="379" y="832.8349">into a single unattributed claim.</text><?plantuml-src VLNBRXit5DtFLrme2oU6BLkA7Jj5Oa1EfQQ0bGAkTrLGS6QkHemeSafoD5M305tr0uh-I_Vvb7n93ZbwZ1orMWn4tWVlEUTUyeZUcfgaphbaVBIdAHPI5uvIpio2oMYcp5XhKcE5vvmo9UIYcnpHWnKPrg8GKZjFpcPdOcebyfmjs1RSBLVqb7yNcVyrhf-Hq3dYsewAyu8jFBj9ukPIbyAA1QKYcnVML3f_OvInz6GKVosFdAUYKdvaj7ydK6NdBQibUvc9pc6ld-KVJBtdBQER